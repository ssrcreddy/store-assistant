server:
  port: 8080

spring:
  application:
    name: commerce-ai-orchestrator
  mvc:
    async:
      request-timeout: 65s
  # Only used when RAG_ENABLED=true. The pool connects lazily, so without RAG no database is needed.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/store}
    username: ${DB_USER:store}
    password: ${DB_PASSWORD:store}
  flyway:
    enabled: ${RAG_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/readiness returns 503 until startup (including the warm-up) has finished.
      # Point the load balancer health check there.
      probes:
        enabled: true
  health:
    db:
      enabled: ${RAG_ENABLED:false}

app:
  llm:
    # anthropic = Claude API (ANTHROPIC_API_KEY). bedrock = Claude on Amazon Bedrock (AWS_REGION + AWS credentials).
    provider: ${LLM_PROVIDER:anthropic}
    # On Bedrock use the prefixed IDs: anthropic.claude-haiku-5-5 / anthropic.claude-sonnet-5-5
    fast-model: ${FAST_MODEL:claude-haiku-5-5}
    smart-model: ${SMART_MODEL:claude-sonnet-5-5}
    fallbacks-enabled: ${LLM_FALLBACKS:true}
    timeout-seconds: 30
    # One tiny fast-model request at startup (about $0.0004) so the first user isn't served cold.
    warmup: ${LLM_WARMUP:true}
  budget:
    monthly-usd: ${LLM_BUDGET_USD:3000}
    degrade-at-fraction: 0.9
    max-tokens-per-session: 15000
  agent:
    max-tool-rounds: 3
    fast-max-tokens: 4096
    smart-max-tokens: 8192
    history-turns: 5
  tools:
    base-url: ${MOCK_API_URL:http://localhost:4000}
    timeout-ms: 800
  rag:
    # false: in-memory keyword search over classpath:knowledge/*.md (no database).
    # true:  hybrid search (Postgres full-text + pgvector) with a local embedding model.
    enabled: ${RAG_ENABLED:false}
    # Vector matches further than this cosine distance are dropped (0 = identical, 2 = opposite).
    # Measured with all-MiniLM-L6-v2: correct chunks were at most 0.81 away, off-topic questions
    # ("tell me a joke") at least 0.87. Re-measure if the embedding model changes.
    max-vector-distance: 0.85
    # Weight of full-text ranks in reciprocal rank fusion (vector ranks weigh 1.0).
    keyword-weight: ${RAG_KEYWORD_WEIGHT:1.0}
  debug-endpoints: ${DEBUG_ENDPOINTS:true}

logging:
  level:
    com.example.commerceai: INFO
    AUDIT: INFO
